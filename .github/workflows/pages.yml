name: Deploy Destiny to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate metadata and discovery files
        run: python3 scripts/build_discovery.py --check

      - name: Prepare public site
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import shutil
          from pathlib import Path

          config = json.loads(Path("seo/site.json").read_text(encoding="utf-8"))
          public = {page["file"] for page in config["pages"]}
          public.update(page["markdown"] for page in config["pages"] if page.get("markdown"))
          public.update({"robots.txt", "sitemap.xml", "ai.json", "llms.txt", "llms-full.txt", "indexnow-key.txt", "CNAME", ".nojekyll"})
          target = Path("_site")
          target.mkdir(exist_ok=True)
          for name in sorted(public):
              if Path(name).name != name:
                  raise ValueError("Public page files must be root-level filenames")
              shutil.copy2(name, target / name)
          shutil.copytree("assets", target / "assets", dirs_exist_ok=True)
          PYTHON

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/notify_indexnow.py
