name: Deploy Destiny to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate metadata and discovery files
        run: python3 scripts/build_discovery.py --check

      - name: Test indexing safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate IndexNow URL list without submitting
        run: python3 scripts/notify_indexnow.py --dry-run

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from build_discovery import discovery_path, load_configs, safe_public_path

          public = {"robots.txt", "sitemap.xml", "indexnow-key.txt", "CNAME", ".nojekyll"}
          for config in load_configs():
              public.update(page["file"] for page in config["pages"])
              public.update(page["markdown"] for page in config["pages"] if page.get("markdown"))
              public.update(discovery_path(config, name) for name in ("ai.json", "llms.txt", "llms-full.txt"))
          target = Path("_site")
          target.mkdir(exist_ok=True)
          for name in sorted(public):
              if not safe_public_path(name):
                  raise ValueError("Public files must be safe relative paths")
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(name, destination)
          shutil.copytree("assets", target / "assets", dirs_exist_ok=True)
          PYTHON

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public indexing after deployment
        timeout-minutes: 4
        run: python3 scripts/check_public_site.py

      - name: Notify IndexNow
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/notify_indexnow.py
